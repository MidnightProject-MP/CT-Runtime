name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22.14.0'
  POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/ctruntime
  FOUNDRY_COMMIT: ${{ vars.FOUNDRY_COMMIT || '5bb45fca93394800f533e75150599a54e6aaf96b' }}

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ctruntime
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ctruntime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Guard GAS deployment policy
        run: |
          bash -n .github/scripts/clasp-run-gate.sh
          test -f .github/scripts/clasp-run-gate.sh
          if git ls-files | grep -Eq '(^|/)\.clasp\.json$|(^|/)\.clasprc\.json$'; then
            echo 'Tracked .clasp.json or .clasprc.json credential/config artifact found; credentials stay out of Git.' >&2
            git ls-files | grep -E '(^|/)\.clasp\.json$|(^|/)\.clasprc\.json$' >&2
            exit 1
          fi
          if grep -Rn -- 'PIPESTATUS' .github/workflows/gas-clasp-deploy.yml .github/workflows/gas-feedback-repair.yml; then
            echo 'Duplicated clasp PIPESTATUS gate found; use .github/scripts/clasp-run-gate.sh as the single implementation.' >&2
            exit 1
          fi
          if grep -RnE '^[[:space:]]*clasp run' .github/workflows/gas-clasp-deploy.yml .github/workflows/gas-feedback-repair.yml; then
            echo 'Bare clasp run found outside the shared gate; route every clasp run through clasp-run-gate.sh.' >&2
            exit 1
          fi
          grep -Fq 'tokens.default' .github/workflows/gas-clasp-deploy.yml || { echo 'Credential-shape assertion for tokens.default is missing.' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch pinned Foundry Observer contract for integration tests
        run: |
          mkdir -p ../CT-Foundry/capabilities/observer
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/MidnightProject-MP/CT-Foundry/$FOUNDRY_COMMIT/capabilities/observer/observer.mjs" --output ../CT-Foundry/capabilities/observer/observer.mjs
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/MidnightProject-MP/CT-Foundry/$FOUNDRY_COMMIT/capabilities/observer/schema.mjs" --output ../CT-Foundry/capabilities/observer/schema.mjs
      - name: Provision database roles required by migrations
        run: |
          PGPASSWORD=test psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anonymous') THEN
              CREATE ROLE anonymous NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Run all local tests
        run: npm test
      - name: Apply migrations explicitly
        run: npm run migrate -- --database-url "$POSTGRES_URL"
      - name: Run PostgreSQL integration suites in isolated databases
        run: |
          PGPASSWORD=test psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ctruntime_postgres_tests'
          PGPASSWORD=test psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ctruntime_observer_tests'
          TEST_DATABASE_URL=postgresql://postgres:test@127.0.0.1:5432/ctruntime_postgres_tests node --test test/postgres.integration.test.mjs
          TEST_DATABASE_URL=postgresql://postgres:test@127.0.0.1:5432/ctruntime_observer_tests node --test test/observer.integration.test.mjs
          TEST_DATABASE_URL=postgresql://postgres:test@127.0.0.1:5432/ctruntime_postgres_tests node --test test/vnext-neon.integration.test.mjs
      - run: npm audit --audit-level=high
