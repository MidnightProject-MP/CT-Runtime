# Deployment control-plane code. See docs/GAS-DEPLOYMENT.md before modifying.
# Changes must preserve the deployment contract tests.

name: GAS self-deploy

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Full reviewed aggregate commit; must equal the dispatched workflow SHA'
        required: true
        type: string
      release_ref:
        description: 'Reviewed refs/tags/gas-release/* tag; workflow must be dispatched on this exact tag'
        required: true
        type: string
      desired_bundle_hash:
        description: 'Reviewed canonical normalized bundle SHA-256'
        required: true
        type: string
      expected_live_bundle_hash:
        description: 'Fresh independently inspected live predecessor SHA-256; no automatic fallback'
        required: true
        type: string
      qualify_only:
        description: 'Run qualification only; do not plan or deploy'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: gas-production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '22.14.0'
  CT_GAS_SCRIPT_ID: '1Uzv-r4UW-y9XLuO-f3QEvrwzInGu1JarmqecVtwarJor6Z5qpmUD2dri'

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: gas-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate and test deployment contract
        run: node --test test/gas-deploy-contract.test.mjs test/gas-deploy-state-machine.test.mjs test/gas-deploy-readback.test.mjs test/gas-target-qualification.test.mjs

      - name: Build complete GAS bundle
        run: |
          node scripts/build-gas-bundle.mjs gas "$RUNNER_TEMP/gas-bundle.json"
          echo "GAS_BUNDLE_HASH=$(node -e "const b=require('fs').readFileSync(process.env.RUNNER_TEMP+'/gas-bundle.json','utf8'); const x=JSON.parse(b); const c=require('node:crypto'); const n=[...x.files].sort((a,b)=>a.name.localeCompare(b.name)); console.log(c.createHash('sha256').update(JSON.stringify(n)).digest('hex'))")" >> "$GITHUB_ENV"

      - name: Authorize exact reviewed release
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_REF: ${{ inputs.release_ref }}
          DESIRED_BUNDLE_HASH: ${{ inputs.desired_bundle_hash }}
          EXPECTED_LIVE_BUNDLE_HASH: ${{ inputs.expected_live_bundle_hash }}
          APPROVED_RELEASE: ${{ vars.GAS_APPROVED_RELEASE }}
        run: |
          node scripts/authorize-gas-release.mjs
          echo "CT_GAS_EXPECTED_LIVE_BUNDLE_HASH=$EXPECTED_LIVE_BUNDLE_HASH" >> "$GITHUB_ENV"

      - name: Submit signed deployment and verify readback
        env:
          CT_GAS_ADMIN_WEB_APP_URL: ${{ secrets.CT_GAS_ADMIN_WEB_APP_URL }}
          CT_GAS_DEPLOY_HMAC_SECRET: ${{ secrets.CT_GAS_DEPLOY_HMAC_SECRET }}
          GAS_BUNDLE_PATH: ${{ runner.temp }}/gas-bundle.json
          CT_GAS_QUALIFY_ONLY: ${{ inputs.qualify_only }}
        run: node scripts/deploy-gas.mjs
