name: PR 2 diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Fetch pinned Foundry Observer contract
        run: |
          mkdir -p ../CT-Foundry/capabilities/observer
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/MidnightProject-MP/CT-Foundry/213143b78486ffd38f3ed01bb9b008ab4fcf97c7/capabilities/observer/observer.mjs" --output ../CT-Foundry/capabilities/observer/observer.mjs
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/MidnightProject-MP/CT-Foundry/213143b78486ffd38f3ed01bb9b008ab4fcf97c7/capabilities/observer/schema.mjs" --output ../CT-Foundry/capabilities/observer/schema.mjs
      - name: Start MinIO
        run: |
          docker run --detach --name minio --publish 9000:9000 --env MINIO_ROOT_USER=test --env MINIO_ROOT_PASSWORD=testtest minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:9000/minio/health/live && break; sleep 2; done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c "mc alias set local http://127.0.0.1:9000 test testtest && mc mb --ignore-existing local/ct-runtime"
      - name: Run tests and capture output
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          echo "$status" > /tmp/test.status
          exit 0
      - name: Comment diagnostic output on PR
        if: always()
        uses: actions/github-script@v7
        env:
          LOG_PATH: /tmp/test.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync(process.env.LOG_PATH, 'utf8');
            const body = `### PR 2 test diagnostic\n\n\`\`\`text\n${log.slice(-12000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
